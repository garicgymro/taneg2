  // -----------------

  function getConditionIntroBlocks(condition) {

var comprehension_check1 = (function() {

var comprehension_loop1_attempts = 0;


// comprehension_loop1 shows the four condition-specific intro screens plus the
// shared no-notes/no-tabs reminder, then checks comprehension of that reminder.

var comprehension_loop1 = {
  timeline: condition_intro_blocks.concat([sharedIntro5, comprehension_check1]),
  loop_function: function() {
    let last = jsPsych.data.get().filter({ task: 'comprehension_check' }).last(1).values()[0];

      alert("That's not quite right — please re-read the instructions.");

var info_confirmation = {

// makeInfoComprehension builds a true/false checklist about the background
// information just given. The Taneg facts are the same across all four
// conditions; the Drogek facts are only included (and only need to be true)
// for the two Drogek conditions, since NoDrogek participants were never told
// about Drogek at all.
function makeInfoComprehension(condition) {
  var hasDrogek = (condition === 'ImmersiveDrogek' || condition === 'NonImmersiveDrogek');
  var isImmersive = (condition === 'ImmersiveDrogek' || condition === 'ImmersiveNoDrogek');

  var immersiveStatements = {
    'Members of your family speak Taneg': true,
    'Barely any Tany people speak Taneg now': false,
    'Less than half the Tany population speaks Taneg regularly': true,
    'Everyone in the community also speaks English': true,
    'You grew up speaking Taneg': false,
    'Taneg is quite similar to English': false
  }

  var nonimmersiveStatements = {
    'Taneg is traditionally associated with the Tany people': true,
    'Barely any Tany people speak Taneg now': false,
    'Less than half the Tany population speaks Taneg regularly': true,
    'Everyone in the community also speaks English': true,
    'Most Tany children grow up speaking Taneg': false,
    'Taneg is quite similar to English': false
  }


  var drogekStatements = {
    'Drogek is at risk of dying out': true,
    'The best way to keep minority languages alive is by recording them for future generations': false
  };


  var nondrogekStatements = {
    'Minority languages are often at risk of dying out': true,
    'The best way to keep minority languages alive is by recording them for future generations': false
  };


  var tanegStatements = isImmersive ? immersiveStatements : nonimmersiveStatements;
  var allStatements = Object.assign({}, tanegStatements, hasDrogek ? drogekStatements : nondrogekStatements);
  var questions = Object.keys(allStatements);
  var correctAnswers = new Set(questions.filter(q => allStatements[q]));

  return {
    type: jsPsychHtmlButtonResponse,
    data: { task: 'info_comprehension', condition: condition },
    stimulus: function() {
      var checkboxes = questions.map((q, i) => `
        <div>
          <input type="checkbox" id="opt${i}" value="${q}">
          <label for="opt${i}" style="font-size:20px;">${q}</label>
        </div>
      `).join('');
      return `
        <p style="font-size:22px;">Select <strong>all</strong> statements that are true:</p>
        ${checkboxes}
        <br>
      `;
    },
    choices: ['Submit'],
    button_html: '<button class="jspsych-btn" style="font-size:18px; margin-top:12px;" ' +
      'onclick="window._infoSelected = Array.from(document.querySelectorAll(\'input[type=checkbox]:checked\')).map(el => el.value)">%choice%</button>',
    on_finish: function(data) {
      var selected = new Set(window._infoSelected || []);
      data.selected = [...selected];
      data.correct = (
        [...correctAnswers].every(a => selected.has(a)) &&
        [...selected].every(a => correctAnswers.has(a))
      );
    }
  };
}

var info_comprehension = makeInfoComprehension(condition);

var info_comprehension_attempts = 0;


// info_comprehension_loop checks comprehension of the background facts that
// were already presented inside condition_intro_blocks above. The intro
// blocks are wrapped in their own nested timeline with a conditional_function
// so they only run again if the participant got the question wrong on the
// previous pass (i.e. on a retry) — on the very first pass they're skipped,
// since they were already shown once in comprehension_loop1.
var info_comprehension_reshow = {
  timeline: condition_intro_blocks,
  conditional_function: function() {
    return info_comprehension_attempts > 0;
  }
};

};

    return msg;

  var bank = document.getElementById('word-bank');
  shuffled.forEach(function(w) {
    var btn = document.createElement('button');
    btn.className = 'jspsych-btn word-bank-btn';
    btn.style.cssText = 'font-size:24px; margin:5px;';
    btn.textContent = w;
    btn.addEventListener('click', function() {
      window._wb_answer.push(w);
      renderAnswer();
    });
    bank.appendChild(btn);
  });

  function renderAnswer() {
    var area = document.getElementById('answer-area');
    area.innerHTML = '';
    window._wb_answer.forEach(function(w, i) {
      var btn = document.createElement('button');
      btn.className = 'jspsych-btn';
      btn.style.cssText = 'font-size:24px; margin:3px; background:#d0e8ff;';
      btn.textContent = w;
      btn.addEventListener('click', function() {
        window._wb_answer.splice(i, 1);
        renderAnswer();
      });
      area.appendChild(btn);
    });
  }
},

  data.response_label = window._wb_answer.join(' ');
  data.stimulus = jsPsych.timelineVariable('image');
  data.correct_response = jsPsych.timelineVariable('word');
  data.correct = data.response_label === data.correct_response;
}
