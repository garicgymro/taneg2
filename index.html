var comprehension_check1 = (function() {
  var options = [
    'Take notes to help me remember',
    'Engage with the app without making notes',
    'Switch to other tabs if I need a break',
    'Use a dictionary to help me'
  ];
  var shuffled; // will be set when the trial runs

  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
  <p style="font-size:22px;">Let's see if you were paying attention!</p>
  <p style="font-size:20px;">Which of the following are you allowed to do during this study?</p>
`,
    choices: function() {
      shuffled = jsPsych.randomization.shuffle(options);
      return shuffled;
    },
    button_html: '<button class="jspsych-btn" style="font-size:20px; margin: 8px;">%choice%</button>',
    data: {
      task: 'comprehension_check',
      correct_response: 'Engage with the app without making notes'
    },
    on_finish: function(data) {
      data.response_label = shuffled[data.response];
      data.correct = data.response_label === data.correct_response;
    }
  };
})();

function makeInfoComprehension(condition) {
  var questions, correctAnswers;

  if (condition === 'Neg') {
    questions = [
      'Taneg is an endangered language',
      'Taneg is spoken by a few million people',
      'All Taneg speakers also speak another language',
      'Taneg speakers mostly also speak English',
      'Some Taneg speakers use it daily',
      'There is a lot of literature written in Taneg'
    ];
    correctAnswers = new Set([
      'Taneg is an endangered language',
      'All Taneg speakers also speak another language',
      'Taneg speakers mostly also speak English',
      'Some Taneg speakers use it daily',
    ]);
  } else {
    questions = [
      'Taneg is a thriving minority language',
      'Taneg is spoken by only a few hundred people',
      'All Taneg speakers are multilingual',
      'Taneg speakers mostly also speak English',
      'No Taneg speakers use it daily',
      'There is original literature written in Taneg'
    ];
    correctAnswers = new Set([
      'Taneg is a thriving minority language',
      'All Taneg speakers are multilingual',
      'Taneg speakers mostly also speak English',
      'There is original literature written in Taneg'
    ]);
  }

  var selectedAtSubmit = []; 

  return {
    type: jsPsychHtmlButtonResponse,
    data: { task: 'info_comprehension', condition: condition },
    stimulus: function() {
      var checkboxes = questions.map((q, i) => `
        <div>
          <input type="checkbox" id="opt${i}" value="${q}">
          <label for="opt${i}" style="font-size:20px;">${q}</label>
        </div>
      `).join('');
      return `
        <p style="font-size:22px;">Select <strong>all</strong> statements that are true about Taneg:</p>
        ${checkboxes}
        <br>
      `;
    },
    choices: ['Submit'],
    button_html: '<button class="jspsych-btn" style="font-size:18px; margin-top:12px;" ' +
      'onclick="window._infoSelected = Array.from(document.querySelectorAll(\'input[type=checkbox]:checked\')).map(el => el.value)">%choice%</button>',
    on_finish: function(data) {
      var selected = new Set(window._infoSelected || []);
      data.selected = [...selected];
      data.correct = (
        [...correctAnswers].every(a => selected.has(a)) &&
        [...selected].every(a => correctAnswers.has(a))
      );
    }
  };
}

var exposure = {
  type: jsPsychImageKeyboardResponse,
  data: { task: 'exposure' },
  stimulus: jsPsych.timelineVariable('image'),
  stimulus_width: 400,
  maintain_aspect_ratio: true,
  prompt: function(){
    return `<p style="font-size:30px;">${jsPsych.timelineVariable('word')}</p>`;
  },
  choices: "NO_KEYS",
  response_ends_trial: false,
  trial_duration: 6000,
  post_trial_gap: 500,

  on_start: function(trial) {
    trial._allow_listener_timeout = setTimeout(function() {
      var listener_registered_at = performance.now();

trial._kb_listener = jsPsych.pluginAPI.getKeyboardResponse({
      callback_function: function(info) {
        var press_time = performance.now();
        // Ignore if the press arrived before the listener opened
        if ((press_time - listener_registered_at) < 3000) {
          trial._kb_listener = jsPsych.pluginAPI.getKeyboardResponse({
            callback_function: function(info2) {
              jsPsych.finishTrial({ rt: info2.rt, key_press: info2.key });
            },
            valid_responses: [' '],
            rt_method: 'performance',
            persist: false
          });
          return;
        }
        jsPsych.finishTrial({ rt: info.rt, key_press: info.key });
      },
      valid_responses: [' '],
      rt_method: 'performance',
      persist: false
    });
  }, 3000);
},

  on_finish: function(data) {
    if (data.rt !== null && data.rt !== undefined) {
      data.rt_valid = data.rt >= 3000;
    } else {
      data.rt_valid = false;
    }
  }
};
